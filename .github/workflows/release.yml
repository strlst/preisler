name: Release

on:
  push:
    tags: ["v*"]
    # Dry run: pushing this branch builds and verifies a signed APK without tagging or publishing.
    branches: ["release-dry-run"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0 (the tag is created from the selected branch)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREISLER_VERSION_NAME: ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || '0.0.0-dryrun' }}
      DRY_RUN: ${{ github.ref == 'refs/heads/release-dry-run' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version and create tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version must look like v1.2.3, got '$VERSION'"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            if gh release view "$VERSION" >/dev/null 2>&1; then
              echo "::error::Release $VERSION already exists"
              exit 1
            fi
            # Left behind by an earlier failed run: no release was published, so it is safe to move.
            echo "::warning::Tag $VERSION exists without a release; moving it to $GITHUB_SHA"
            git tag -f "$VERSION"
            git push -f origin "refs/tags/$VERSION"
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets are present
        env:
          KEYSTORE_B64: ${{ secrets.PREISLER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret PREISLER_KEYSTORE_BASE64 is missing. See SKILLS.md > Cut a release."
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.PREISLER_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "PREISLER_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Checks
        # AGP 9 creates unit-test tasks for the debug build type only.
        run: ./gradlew spotlessCheck :receipt-core:test :app:testDebugUnitTest :app:lintRelease :app:verifyReleasePrivacyManifest

      - name: Assemble signed release APK
        env:
          PREISLER_KEYSTORE_PASSWORD: ${{ secrets.PREISLER_KEYSTORE_PASSWORD }}
          PREISLER_KEY_ALIAS: ${{ secrets.PREISLER_KEY_ALIAS }}
          PREISLER_KEY_PASSWORD: ${{ secrets.PREISLER_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify APK signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -v -i "public key"

      - name: Rename APK
        if: env.DRY_RUN != 'true'
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/preisler-${PREISLER_VERSION_NAME}.apk"

      - name: Publish GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$PREISLER_VERSION_NAME" >/dev/null 2>&1; then
            gh release upload "$PREISLER_VERSION_NAME" out/*.apk --clobber
          else
            gh release create "$PREISLER_VERSION_NAME" out/*.apk --title "preisler $PREISLER_VERSION_NAME" --generate-notes
          fi
