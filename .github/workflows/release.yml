name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREISLER_VERSION_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets are present
        env:
          KEYSTORE_B64: ${{ secrets.PREISLER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret PREISLER_KEYSTORE_BASE64 is missing. See SKILLS.md > Cut a release."
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.PREISLER_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "PREISLER_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Checks
        run: ./gradlew spotlessCheck :receipt-core:test :app:testReleaseUnitTest :app:lintRelease :app:verifyReleasePrivacyManifest

      - name: Assemble signed release APK
        env:
          PREISLER_KEYSTORE_PASSWORD: ${{ secrets.PREISLER_KEYSTORE_PASSWORD }}
          PREISLER_KEY_ALIAS: ${{ secrets.PREISLER_KEY_ALIAS }}
          PREISLER_KEY_PASSWORD: ${{ secrets.PREISLER_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/preisler-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.apk --title "preisler $GITHUB_REF_NAME" --generate-notes
