name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Format check (ktlint via Spotless)
        run: ./gradlew spotlessCheck --continue

      - name: Core unit tests
        run: ./gradlew :receipt-core:test

      - name: App unit tests, lint and privacy manifest check
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:verifyDebugPrivacyManifest :app:verifyReleasePrivacyManifest

      - name: Show requested permissions
        run: cat app/build/reports/privacy/*.txt

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      # Catches R8/minification and release-lint problems before a real release (unsigned, not uploaded).
      - name: Assemble release APK (unsigned smoke test)
        run: ./gradlew :app:lintRelease :app:assembleRelease

      - name: APK size report
        run: |
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            echo "== $apk: $(( $(stat -c%s "$apk") / 1024 )) KiB"
            unzip -lv "$apk" | awk 'NR>3 && $1 ~ /^[0-9]+$/ {print $3, $1, $8}' | sort -rn | head -12 \
              | awk '{printf "  %8d KiB compressed  %8d KiB raw  %s\n", $1/1024, $2/1024, $3}'
            unzip -l "$apk" | awk '$4 ~ /^lib\// {split($4,p,"/"); s[p[2]]+=$1} END {for (a in s) printf "  ABI %-12s %6d KiB raw\n", a, s[a]/1024}'
          done

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/preisler-debug-${GITHUB_SHA::7}.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: preisler-debug-${{ github.sha }}
          path: out/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
