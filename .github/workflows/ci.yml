name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Format check (ktlint via Spotless)
        run: ./gradlew spotlessCheck --continue

      - name: Core unit tests
        run: ./gradlew :receipt-core:test

      - name: App unit tests, lint and privacy manifest check
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:verifyDebugPrivacyManifest :app:verifyReleasePrivacyManifest

      - name: Show requested permissions
        run: cat app/build/reports/privacy/*.txt

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/preisler-debug-${GITHUB_SHA::7}.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: preisler-debug-${{ github.sha }}
          path: out/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
